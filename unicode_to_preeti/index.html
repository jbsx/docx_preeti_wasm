<!doctype html>
<html lang="en-US">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unicode to Preeti Converter (युनिकोड → प्रिति) - Lipi</title>
    <meta name="description"
        content="Convert Unicode Nepali (UTF-8) text and Word (.docx) files back to the Preeti font encoding online. Free, no sign-up, 100% client-side — your documents never leave your browser." />
    <link rel="canonical" href="https://lipi.buildtogether.ai/unicode_to_preeti/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lipi" />
    <meta property="og:title" content="Unicode to Preeti Converter - Lipi" />
    <meta property="og:description"
        content="Convert Unicode Nepali (UTF-8) text and Word (.docx) files back to Preeti encoding. Free, no sign-up, 100% client-side." />
    <meta property="og:url" content="https://lipi.buildtogether.ai/unicode_to_preeti/" />
    <meta property="og:image" content="https://lipi.buildtogether.ai/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Unicode to Preeti Converter - Lipi" />
    <meta name="twitter:description"
        content="Convert Unicode Nepali (UTF-8) text and Word (.docx) files back to Preeti encoding. Free, no sign-up, 100% client-side." />
    <meta name="twitter:image" content="https://lipi.buildtogether.ai/og-image.png" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <script src="../tailwind.js"></script>
    <script src="../coi-serviceworker.min.js"></script>
    <script type="module" src="app.js"></script>
    <link rel="stylesheet" href="../style.css">
</head>

<body class="min-h-screen w-full flex flex-col items-center gap-8 bg-white p-8">
    <div id="container" class="flex flex-col items-center">
        <div class="mb-8 text-center">
            <h1 class="mb-2 text-4xl font-bold text-gray-900">Unicode to Preeti</h1>
            <p class="text-lg text-gray-600">Convert your Unicode (UTF-8) .docx file to Preeti</p>
        </div>
        <div id="input-label" class="flex flex-col items-center gap-4">
            <label for="file_select"
                class="w-[30vw] h-[30vh] min-h-[200px] min-w-[400px] flex justify-center
                    items-center cursor-pointer border-2 border-dashed border-stone-300 bg-white transition-colors duration-200 hover:border-stone-400 hover:bg-stone-50">
                <input id="file_select" type="file" hidden
                    accept="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                <div class="flex flex-col justify-center items-center gap-6">
                    <div class="flex h-12 w-12 items-center justify-center bg-stone-100">
                        <svg class="h-6 w-6 text-stone-600 pointer-events-none" fill="none" stroke="currentColor"
                            stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6h.1a5 5 0 011 9.9M12 12v9m0-9l-3 3m3-3l3 3" />
                        </svg>
                    </div>
                    <div class="text-center flex flex-col gap-1">
                        <span class="text-lg font-semibold text-gray-900">
                            Drop your .docx file here
                        </span>
                        <span class="text-sm text-gray-600">
                            or click to select a file
                        </span>
                    </div>
                </div>
            </label>
            <p class="text-sm text-gray-500">Note: May cause unintentional conversion of symbols.</p>
        </div>

        <div class="relative hidden" id="loading">
            <div class="lds-ring">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div class="absolute top-[50%] left-[50%] translate-x-[-50%] translate-y-[-50%] text-gray-600"
                id="loadpercent"></div>
        </div>

        <!-- Download button -->
        <a class="hidden mt-6 cursor-pointer border border-stone-200 bg-white px-6 py-3 text-sm font-semibold text-gray-900 transition-colors duration-200 hover:bg-stone-50"
            id="btn">
            Download converted file
        </a>

    </div>
    <div class="flex flex-wrap justify-center w-[90vw] gap-6">
        <div>
            <h3 class="mb-2 text-lg font-semibold text-gray-900">Unicode</h3>
            <textarea id="unicode"
                class="w-full min-w-[400px] min-h-[25vh] p-3 bg-white border border-stone-200 outline-none focus:border-stone-400"></textarea>
        </div>
        <div>
            <h3 class="mb-2 text-lg font-semibold text-gray-900">Preeti</h3>
            <textarea id="preeti"
                class="w-full min-w-[400px] min-h-[25vh] p-3 bg-white border border-stone-200 outline-none focus:border-stone-400"></textarea>
        </div>
    </div>
    <div class="flex flex-wrap justify-center gap-4 pb-8">
        <a class="cursor-pointer border border-stone-200 bg-white px-6 py-3 text-sm font-semibold text-gray-900 transition-colors duration-200 hover:bg-stone-50"
            href="../preeti_to_unicode/">
            Switch to Preeti to Unicode
        </a>
        <a class="cursor-pointer border border-stone-200 bg-white px-6 py-3 text-sm font-semibold text-gray-900 transition-colors duration-200 hover:bg-stone-50"
            href="../">
            &larr; Back to Lipi
        </a>
    </div>
</body>

</html>
